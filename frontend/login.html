<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#06080b">
    <title>Block Spin - เข้าสู่ระบบ Admin</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧊%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="grid-bg" aria-hidden="true"></div>
    <canvas id="fx" aria-hidden="true"></canvas>
    <div class="snow-ground" aria-hidden="true"></div>

    <main class="auth-shell">
        <div class="auth-card glass" id="card">
            <div class="auth-head">
                <div class="logo" aria-hidden="true"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
                <h1>เข้าสู่ระบบ Admin</h1>
                <p>Block Spin Monitor Dashboard</p>
            </div>

            <form id="login-form" novalidate>
                <div class="field">
                    <label for="username">ชื่อผู้ใช้</label>
                    <div class="input">
                        <i class="fa-solid fa-user lead"></i>
                        <input type="text" id="username" autocomplete="username" required placeholder="กรอกชื่อผู้ใช้" autofocus>
                    </div>
                </div>

                <div class="field">
                    <label for="password">รหัสผ่าน</label>
                    <div class="input">
                        <i class="fa-solid fa-lock lead"></i>
                        <input type="password" id="password" autocomplete="current-password" required placeholder="กรอกรหัสผ่าน">
                        <button type="button" class="eye" id="eye" aria-label="แสดงรหัสผ่าน"><i class="fa-regular fa-eye"></i></button>
                    </div>
                    <div class="hint" id="caps" hidden><i class="fa-solid fa-triangle-exclamation"></i> Caps Lock เปิดอยู่</div>
                </div>

                <div class="form-error" id="error-msg" role="alert" hidden></div>

                <button type="submit" class="btn btn-primary" id="submit">เข้าสู่ระบบ</button>
                <a href="/" class="back-link"><i class="fa-solid fa-arrow-left"></i> กลับหน้า Dashboard</a>
            </form>
        </div>
    </main>

    <script src="common.js"></script>
    <script src="particles.js"></script>
    <script src="login.js"></script>
</body>
</html>
